name: Bug report
description: Report a reproducible problem in Jobmatcha.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, API keys, resumes, or sensitive personal data.
        For security vulnerabilities, use private reporting instead of this form.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jobmatcha version or commit
      placeholder: v1.2.3
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Jobmatcha?
      options:
        - Docker Compose
        - Container runtime
        - Local development
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal data before attaching anything.
