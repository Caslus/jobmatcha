name: Test

on:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-me:
    name: Conventional Commit validation
    runs-on: ubuntu-latest
    steps:
      - uses: dev-build-deploy/commit-me@27d14296ec218488c543616d9128d7e75ab7463a # v1.5.3
        with:
          token: ${{ github.token }}
          include-commits: true
          update-labels: false
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test

  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.filter.outputs.application }}
      docs: ${{ steps.filter.outputs.docs }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: .github/filters.yml
    permissions:
      pull-requests: read

  container:
    name: Container smoke test
    needs: changes
    if: needs.changes.outputs.application == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - run: mise run ci:container

  application:
    name: Application checks and coverage
    needs: changes
    if: needs.changes.outputs.application == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/mise
            ~/.local/share/mise
            ~/.cache/pnpm
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-application-${{ hashFiles('mise.toml', 'server/go.sum', 'web/pnpm-lock.yaml') }}
      - run: pnpm --dir web install --frozen-lockfile
      - run: mise run ci:application
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: coverage
          path: |
            server/coverage.out
            server/coverage.html
            web/coverage
          retention-days: 14

  docs:
    name: Documentation build
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/mise
            ~/.local/share/mise
            ~/.cache/pnpm
          key: ${{ runner.os }}-docs-${{ hashFiles('mise.toml', 'docs/pnpm-lock.yaml') }}
      - run: pnpm --dir docs install --frozen-lockfile --config.strictDepBuilds=false
      - run: mise run ci:docs

  e2e:
    name: Browser E2E
    needs: changes
    if: needs.changes.outputs.application == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/mise
            ~/.local/share/mise
            ~/.cache/pnpm
            ~/.cache/ms-playwright
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-e2e-${{ hashFiles('mise.toml', 'server/go.sum', 'web/pnpm-lock.yaml') }}
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: mise run ci:e2e
      - if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  verify:
    name: Test
    if: always()
    needs: [commit-me, changes, container, application, docs, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null; then
            exit 0
          fi
          exit 1
